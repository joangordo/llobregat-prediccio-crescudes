[project]
name = "llobregat-flood-forecasting"
version = "1.0.0"
description = "Probabilistic streamflow and flood forecasting for the Llobregat River (Catalonia), updated every 30 minutes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joan Gordó Guardia" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-calamine>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    "shapely>=2.0",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.5", "lightgbm>=4.3"]
experiments = ["optuna>=3.6", "mlflow>=2.13", "shap>=0.45", "duckdb>=1.0"]
report = ["matplotlib>=3.8"]

[project.scripts]
llobregat = "llobregat.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "pre-commit>=3.7", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llobregat"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII characters (·, −, ×) in text

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
